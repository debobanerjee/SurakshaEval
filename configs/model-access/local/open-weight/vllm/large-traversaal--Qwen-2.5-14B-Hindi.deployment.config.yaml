# Native vLLM serve config for Qwen-2.5-14B-Hi.
# Starting hardware assumption: 2 x 80GB GPUs (A100/H100 class).
# Context length and concurrency affect memory use; tune for your workload.
model: large-traversaal/Qwen-2.5-14B-Hindi
served-model-name:
- large-traversaal/Qwen-2.5-14B-Hindi
host: 127.0.0.1
# Authentication key is read from VLLM_API_KEY; never store the secret here.
api-key: null
port: 8815
tensor-parallel-size: 2
tokenizer-mode: auto
config-format: auto
load-format: auto
dtype: bfloat16
gpu-memory-utilization: 0.95
max-num-seqs: 256
block-size: 256
seed: 42
max-model-len: 8192
generation-config: vllm

# Model card: https://huggingface.co/large-traversaal/Qwen-2.5-14B-Hindi
# Parser decision and recipe sources: docs/parser_audit.md
# No reasoning-parser: no separate structured-thinking format verified.
enable-auto-tool-choice: true
tool-call-parser: hermes
