# Native vLLM serve config for Llama-3.1-8B-Inst.
# Starting hardware assumption: 1 x 80GB GPUs (A100/H100 class).
# For 40GB GPUs, set tensor-parallel-size to 2.
# Context length and concurrency affect memory use; tune for your workload.
model: meta-llama/Llama-3.1-8B-Instruct
served-model-name:
- meta-llama/Llama-3.1-8B-Instruct
host: 127.0.0.1
# Authentication key is read from VLLM_API_KEY; never store the secret here.
api-key: null
port: 8817
tensor-parallel-size: 1
tokenizer-mode: auto
config-format: auto
load-format: auto
dtype: bfloat16
gpu-memory-utilization: 0.95
max-num-seqs: 256
block-size: 256
seed: 42
max-model-len: 8192
generation-config: vllm

# Model card: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
# Parser decision and recipe sources: docs/parser_audit.md
# No reasoning-parser: no separate structured-thinking format verified.
enable-auto-tool-choice: true
tool-call-parser: llama3_json
